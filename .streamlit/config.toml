[server]
# 로컬 실행 주소/포트는 실행.cmd 또는 명령행에서 지정합니다.
headless = true
maxUploadSize = 20
enableXsrfProtection = true
enableCORS = true
enableStaticServing = false

[browser]
gatherUsageStats = false

[theme]
base = "light"
primaryColor = "#087E8B"
backgroundColor = "#F5F8FA"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#172B3A"
font = "sans serif"
